name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install jsonschema pytest numpy

      - name: Validate examples and fixtures
        run: python scripts/validate_examples.py

      - name: Check landmark-table changes against the 0.1.1 inventory
        run: python scripts/compare_inventory.py

      - name: Check the global axis convention of the landmark table
        run: python scripts/check_conventions.py

      - name: Run tests
        run: python -m pytest -v
